<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Mini Biblioteca</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; }
        h1 { text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px 12px; text-align: left; }
        th { background: #333; color: #fff; }
        tr:nth-child(even) { background: #f5f5f5; }
        .disponivel { color: green; font-weight: bold; }
        .indisponivel { color: #b00; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Mini Biblioteca</h1>

    {% if livros %}
    <table>
        <thead>
            <tr>
                <th>Título</th>
                <th>Autor</th>
                <th>Ano</th>
                <th>Disponível</th>
            </tr>
        </thead>
        <tbody>
            {% for livro in livros %}
            <tr>
                <td>{{ livro.title }}</td>
                <td><a href="{% url 'biblioteca:author_detail' livro.author.pk %}">{{ livro.author.name }}</a></td>
                <td>{{ livro.year }}</td>
                <td>
                    {% if livro.available %}
                        <span class="disponivel">Sim</span>
                    {% else %}
                        <span class="indisponivel">Não</span>
                    {% endif %}
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
    <p>Nenhum livro cadastrado.</p>
    {% endif %}
</body>
</html>
